name: Positioning review rendered acceptance
on:
  pull_request:
    paths:
      - 'src/app/tools/positioning-check/**'
      - 'src/app/api/tools/positioning-check/**'
      - 'src/lib/positioning-check/**'
      - 'tests/positioning-check/**'
      - 'docs/positioning-check/browser-fixtures/**'
      - 'playwright.positioning.config.ts'
      - '.github/workflows/positioning-check-rendered.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  positioning-rendered:
    name: Positioning review rendered copy and contrast
    runs-on: ubuntu-24.04 # Keep browser checks on the supported Playwright OS.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify bounded backend
        run: npx vitest run src/lib/positioning-check/__tests__
      - name: Install fixed Chromium
        run: node scripts/ensure-playwright-chromium.mjs
      - name: Verify positioning interaction, copy and contrast
        run: npx playwright test --config=playwright.positioning.config.ts
      - name: Upload positioning screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: positioning-rendered-evidence
          path: test-results/positioning-check/**
          if-no-files-found: ignore
          retention-days: 7


