name: Reviewed prospect enrichment migration

'on':
  workflow_dispatch:
    inputs:
      operation:
        description: Validate the exact plan, or apply after the separate production approval.
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      reviewed_source_sha:
        description: Exact reviewed 40-character current main commit SHA.
        required: true
        type: string
      confirmation:
        description: "Required only for apply: APPLY-PROSPECT-ENRICHMENT-V1"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: gta-prospect-migrations-production
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'adrianosortudo-source/caseload-select'
    name: Reviewed prospect enrichment schema gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production prospect migrations
    env:
      PROJECT_REF: ssxryjxifwiivghglqer
      OPERATION: ${{ inputs.operation }}
      REVIEWED_SOURCE_SHA: ${{ inputs.reviewed_source_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
      CONFIGURED_REVIEWED_SHA: ${{ vars.PROSPECT_ENRICHMENT_MIGRATION_REVIEWED_SHA }}
    steps:
      - name: Check out current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Validate exact reviewed source and protected configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.CASELOAD_PRODUCTION_SUPABASE_MIGRATOR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          unset SUPABASE_DB_PASSWORD SUPABASE_DB_URL SUPABASE_PROJECT_ID SUPABASE_API_URL
          export CHECKOUT_SHA="$(git rev-parse HEAD)"
          node scripts/prospect-enrichment/migration-gate.mjs source > "$RUNNER_TEMP/source-check.json"
          git fetch --no-tags origin main
          test "$CHECKOUT_SHA" = "$(git rev-parse origin/main)"
          node scripts/prospect-enrichment/migration-gate.mjs query > "$RUNNER_TEMP/enrichment-ledger-readback.sql"

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.117.0

      - name: Discover pinned command interfaces and verify version
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "2.117.0"
          supabase db push --help > "$RUNNER_TEMP/db-push-help.txt"
          supabase db query --help > "$RUNNER_TEMP/db-query-help.txt"
          grep -q -- '--project-ref' "$RUNNER_TEMP/db-push-help.txt"
          grep -q -- '--project-ref' "$RUNNER_TEMP/db-query-help.txt"

      - name: Require the exact pending migration and no seeds or roles
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.CASELOAD_PRODUCTION_SUPABASE_MIGRATOR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          unset SUPABASE_DB_PASSWORD SUPABASE_DB_URL SUPABASE_PROJECT_ID SUPABASE_API_URL
          supabase db push --linked --dry-run --include-all --skip-vault \
            --project-ref "$PROJECT_REF" --output-format json > "$RUNNER_TEMP/plan.json"
          node scripts/prospect-enrichment/migration-gate.mjs plan pre "$RUNNER_TEMP/plan.json" > "$RUNNER_TEMP/plan-check.json"

      - name: Stop after the default dry run
        if: inputs.operation == 'dry-run'
        shell: bash
        run: |
          set -euo pipefail
          echo "The reviewed prospect enrichment plan matches. No migration was applied."

      - name: Recheck and apply the separately approved migration
        id: apply_migration
        if: inputs.operation == 'apply'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.CASELOAD_PRODUCTION_SUPABASE_MIGRATOR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          unset SUPABASE_DB_PASSWORD SUPABASE_DB_URL SUPABASE_PROJECT_ID SUPABASE_API_URL
          export CHECKOUT_SHA="$(git rev-parse HEAD)"
          node scripts/prospect-enrichment/migration-gate.mjs source > "$RUNNER_TEMP/apply-source-check.json"
          git fetch --no-tags origin main
          test "$CHECKOUT_SHA" = "$(git rev-parse origin/main)"
          supabase db push --linked --dry-run --include-all --skip-vault \
            --project-ref "$PROJECT_REF" --output-format json > "$RUNNER_TEMP/immediate-plan.json"
          node scripts/prospect-enrichment/migration-gate.mjs plan pre "$RUNNER_TEMP/immediate-plan.json" > "$RUNNER_TEMP/immediate-plan-check.json"
          echo "apply_started=true" >> "$GITHUB_OUTPUT"
          supabase db push --linked --yes --include-all --skip-vault \
            --project-ref "$PROJECT_REF" --output-format json > "$RUNNER_TEMP/apply.json"
          node scripts/prospect-enrichment/migration-gate.mjs plan apply "$RUNNER_TEMP/apply.json" > "$RUNNER_TEMP/apply-check.json"

      - name: Verify applied version, complete SQL content and empty pending plan
        if: always() && inputs.operation == 'apply' && steps.apply_migration.outputs.apply_started == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.CASELOAD_PRODUCTION_SUPABASE_MIGRATOR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          unset SUPABASE_DB_PASSWORD SUPABASE_DB_URL SUPABASE_PROJECT_ID SUPABASE_API_URL
          supabase db query --linked --project-ref "$PROJECT_REF" \
            --file "$RUNNER_TEMP/enrichment-ledger-readback.sql" --output json --agent no > "$RUNNER_TEMP/ledger.json"
          node scripts/prospect-enrichment/migration-gate.mjs ledger "$RUNNER_TEMP/ledger.json" > "$RUNNER_TEMP/ledger-check.json"
          supabase db push --linked --dry-run --include-all --skip-vault \
            --project-ref "$PROJECT_REF" --output-format json > "$RUNNER_TEMP/post-apply-plan.json"
          node scripts/prospect-enrichment/migration-gate.mjs plan post "$RUNNER_TEMP/post-apply-plan.json" > "$RUNNER_TEMP/post-apply-check.json"

      - name: Upload bounded migration verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prospect-enrichment-migration-evidence
          path: |
            scripts/prospect-enrichment/migration-release.json
            ${{ runner.temp }}/source-check.json
            ${{ runner.temp }}/plan-check.json
            ${{ runner.temp }}/apply-source-check.json
            ${{ runner.temp }}/immediate-plan-check.json
            ${{ runner.temp }}/apply-check.json
            ${{ runner.temp }}/ledger-check.json
            ${{ runner.temp }}/post-apply-check.json
          if-no-files-found: error
