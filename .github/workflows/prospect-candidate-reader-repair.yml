name: Reviewed candidate reader timeout repair
on:
  workflow_dispatch:
    inputs:
      reviewed_source_sha:
        description: Exact reviewed 40-character main commit containing the reader repair receipt and migration.
        required: true
        type: string
      use_temporary_database_credential:
        description: Use the protected short-lived Supabase login; database writes still require the second environment review.
        required: false
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: gta-prospect-migrations-production
  cancel-in-progress: false
jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'adrianosortudo-source/caseload-select'
    name: Read-only reader repair preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Production prospect migrations
    env:
      PROJECT_REF: ssxryjxifwiivghglqer
      REVIEWED_SOURCE_SHA: ${{ inputs.reviewed_source_sha }}
      USE_TEMPORARY_DATABASE_CREDENTIAL: ${{ inputs.use_temporary_database_credential }}
      CREDENTIAL_GATE: candidate-reader-repair
    steps:
      - name: Check out the exact dispatch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.reviewed_source_sha }}
          fetch-depth: 0
      - name: Verify exact current main source and reader receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$REVIEWED_SOURCE_SHA" = "$(git rev-parse HEAD)"
          test "$REVIEWED_SOURCE_SHA" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          test "$REVIEWED_SOURCE_SHA" = "$(git rev-parse origin/main)"
          node scripts/prospect-enrichment/candidate-reader-repair-gate.mjs source > "$RUNNER_TEMP/reader-source-check.json"
          node scripts/prospect-enrichment/additive-release-gate.mjs receipt > "$RUNNER_TEMP/additive-receipt-check.json"
      - name: Load protected static database connection
        if: ${{ !inputs.use_temporary_database_credential }}
        env:
          STATIC_MIGRATION_DATABASE_URL: ${{ secrets.CASELOAD_PRODUCTION_SUPABASE_MIGRATOR_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STATIC_MIGRATION_DATABASE_URL"
          [[ "$STATIC_MIGRATION_DATABASE_URL" != *$'\n'* && "$STATIC_MIGRATION_DATABASE_URL" != *$'\r'* ]]
          printf 'MIGRATION_DATABASE_URL=%s\n' "$STATIC_MIGRATION_DATABASE_URL" >> "$GITHUB_ENV"
      - name: Request protected short-lived database authentication
        if: inputs.use_temporary_database_credential
        env:
          MIGRATION_ACCESS_TOKEN: ${{ secrets.CASELOAD_PRODUCTION_SUPABASE_MIGRATOR_TOKEN }}
        shell: bash
        run: node scripts/prospect-enrichment/temporary-credential.mjs
      - name: Configure pinned database TLS
        shell: bash
        run: node scripts/prospect-enrichment/configure-migration-tls.mjs
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.117.0
      - name: Validate protected connection and reviewed CLI
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "2.117.0"
          supabase db push --help > "$RUNNER_TEMP/push-help.txt"
          grep -q -- '--include-all' "$RUNNER_TEMP/push-help.txt"
          node scripts/prospect-enrichment/migration-gate.mjs connection > "$RUNNER_TEMP/connection-check.json"
      - name: Verify existing additive receipt, ledger statements and prerequisite catalog
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prospect-enrichment/additive-release-gate.mjs ledger-query > "$RUNNER_TEMP/additive-ledger.sql"
          supabase db query --db-url "$MIGRATION_DATABASE_URL" --file "$RUNNER_TEMP/additive-ledger.sql" --output json --agent no > "$RUNNER_TEMP/additive-ledger.json"
          node scripts/prospect-enrichment/additive-release-gate.mjs ledger "$RUNNER_TEMP/additive-ledger.json" > "$RUNNER_TEMP/additive-ledger-check.json"
          node scripts/prospect-enrichment/additive-release-gate.mjs candidate-complete "$RUNNER_TEMP/additive-ledger-check.json" > "$RUNNER_TEMP/additive-complete-check.json"
          node scripts/prospect-enrichment/additive-release-gate.mjs catalog-query > "$RUNNER_TEMP/operator-catalog.sql"
          supabase db query --db-url "$MIGRATION_DATABASE_URL" --file "$RUNNER_TEMP/operator-catalog.sql" --output json --agent no > "$RUNNER_TEMP/operator-catalog.json"
          node scripts/prospect-enrichment/additive-release-gate.mjs catalog-bound "$RUNNER_TEMP/operator-catalog.json" "$RUNNER_TEMP/additive-ledger.json" > "$RUNNER_TEMP/operator-catalog-check.json"
      - name: Require exactly the reader migration in full-ledger preflight
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prospect-enrichment/migration-gate.mjs stage "$GITHUB_WORKSPACE" "$RUNNER_TEMP/reader-migrations" > "$RUNNER_TEMP/staged-inventory.json"
          node scripts/prospect-enrichment/migration-gate.mjs full-query > "$RUNNER_TEMP/full-ledger.sql"
          supabase db query --db-url "$MIGRATION_DATABASE_URL" --file "$RUNNER_TEMP/full-ledger.sql" --output json --agent no > "$RUNNER_TEMP/full-ledger.json"
          node scripts/prospect-enrichment/migration-gate.mjs full-ledger "$RUNNER_TEMP/full-ledger.json" "$RUNNER_TEMP/reader-migrations" candidate-reader-repair-pending '["supabase/migrations/20260930050000_prospect_candidate_coverage_warning_index.sql","supabase/migrations/20260930130000_prospect_candidate_reader_defer_legacy_audit.sql"]' > "$RUNNER_TEMP/full-ledger-check.json"
          (cd "$RUNNER_TEMP/reader-migrations" && supabase db push --db-url "$MIGRATION_DATABASE_URL" --dry-run --include-all --skip-vault --output-format json) > "$RUNNER_TEMP/preflight-plan.json"
          PLAN_PHASE=pre node scripts/prospect-enrichment/candidate-reader-repair-gate.mjs plan "$RUNNER_TEMP/preflight-plan.json" "$RUNNER_TEMP/full-ledger-check.json" > "$RUNNER_TEMP/preflight-plan-check.json"
          node scripts/prospect-enrichment/migration-gate.mjs verify-stage "$GITHUB_WORKSPACE" "$RUNNER_TEMP/reader-migrations" "$RUNNER_TEMP/staged-inventory.json" > "$RUNNER_TEMP/stage-check.json"
      - name: Bind preflight evidence to run, source and migration
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const fs=require("node:fs");const r=JSON.parse(fs.readFileSync("scripts/prospect-enrichment/candidate-reader-repair-review.json","utf8"));if(!Array.isArray(r.migrations)||r.migrations.length!==2)process.exit(1);fs.writeFileSync(process.env.RUNNER_TEMP+"/preflight-binding.json",JSON.stringify({runId:process.env.GITHUB_RUN_ID,sourceSha:process.env.REVIEWED_SOURCE_SHA,migrationSha256:require("node:crypto").createHash("sha256").update(JSON.stringify(r.migrations)).digest("hex"),receiptSha256:require("node:crypto").createHash("sha256").update(fs.readFileSync("scripts/prospect-enrichment/candidate-reader-repair-review.json")).digest("hex"),databaseWrites:0})+"\n");'
          cat "$RUNNER_TEMP/preflight-binding.json"
      - name: Upload redacted preflight evidence for second review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prospect-reader-repair-preflight-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/preflight-binding.json
            ${{ runner.temp }}/reader-source-check.json
            ${{ runner.temp }}/additive-receipt-check.json
            ${{ runner.temp }}/connection-check.json
            ${{ runner.temp }}/additive-ledger-check.json
            ${{ runner.temp }}/additive-complete-check.json
            ${{ runner.temp }}/operator-catalog-check.json
            ${{ runner.temp }}/staged-inventory.json
            ${{ runner.temp }}/full-ledger-check.json
            ${{ runner.temp }}/preflight-plan-check.json
            ${{ runner.temp }}/stage-check.json
          if-no-files-found: error
          retention-days: 30
  apply:
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'adrianosortudo-source/caseload-select'
    name: Apply reviewed reader repair and verify read-back
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Production prospect migrations
    env:
      PROJECT_REF: ssxryjxifwiivghglqer
      REVIEWED_SOURCE_SHA: ${{ inputs.reviewed_source_sha }}
      USE_TEMPORARY_DATABASE_CREDENTIAL: ${{ inputs.use_temporary_database_credential }}
      CREDENTIAL_GATE: candidate-reader-repair
    steps:
      - name: Check out the exact dispatch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.reviewed_source_sha }}
          fetch-depth: 0
      - name: Download this run's reviewed preflight evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8
        with:
          name: prospect-reader-repair-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/reviewed-preflight
      - name: Rebind second review to exact evidence and source
        shell: bash
        run: |
          set -euo pipefail
          test "$REVIEWED_SOURCE_SHA" = "$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          test "$REVIEWED_SOURCE_SHA" = "$(git rev-parse origin/main)"
          node scripts/prospect-enrichment/candidate-reader-repair-gate.mjs source > "$RUNNER_TEMP/reader-source-check.json"
          node -e 'const fs=require("node:fs");const cp=require("node:child_process");const c=require("node:crypto");const b=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/reviewed-preflight/preflight-binding.json","utf8"));const r=JSON.parse(fs.readFileSync("scripts/prospect-enrichment/candidate-reader-repair-review.json","utf8"));const h=c.createHash("sha256").update(fs.readFileSync("scripts/prospect-enrichment/candidate-reader-repair-review.json")).digest("hex");const m=c.createHash("sha256").update(JSON.stringify(r.migrations)).digest("hex");if(b.runId!==process.env.GITHUB_RUN_ID||b.sourceSha!==process.env.REVIEWED_SOURCE_SHA||b.sourceSha!==cp.execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim()||b.migrationSha256!==m||b.receiptSha256!==h||b.databaseWrites!==0)process.exit(1);'
          node scripts/prospect-enrichment/additive-release-gate.mjs receipt > "$RUNNER_TEMP/additive-receipt-check.json"
      - name: Load protected static database connection
        if: ${{ !inputs.use_temporary_database_credential }}
        env:
          STATIC_MIGRATION_DATABASE_URL: ${{ secrets.CASELOAD_PRODUCTION_SUPABASE_MIGRATOR_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STATIC_MIGRATION_DATABASE_URL"
          [[ "$STATIC_MIGRATION_DATABASE_URL" != *$'\n'* && "$STATIC_MIGRATION_DATABASE_URL" != *$'\r'* ]]
          printf 'MIGRATION_DATABASE_URL=%s\n' "$STATIC_MIGRATION_DATABASE_URL" >> "$GITHUB_ENV"
      - name: Request protected short-lived database authentication
        if: inputs.use_temporary_database_credential
        env:
          MIGRATION_ACCESS_TOKEN: ${{ secrets.CASELOAD_PRODUCTION_SUPABASE_MIGRATOR_TOKEN }}
        shell: bash
        run: node scripts/prospect-enrichment/temporary-credential.mjs
      - name: Configure pinned database TLS
        shell: bash
        run: node scripts/prospect-enrichment/configure-migration-tls.mjs
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.117.0
      - name: Recheck original receipt, full ledger and exact dry-run before apply
        id: apply_migration
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "2.117.0"
          node scripts/prospect-enrichment/migration-gate.mjs connection > "$RUNNER_TEMP/connection-check.json"
          node scripts/prospect-enrichment/additive-release-gate.mjs ledger-query > "$RUNNER_TEMP/additive-ledger.sql"
          supabase db query --db-url "$MIGRATION_DATABASE_URL" --file "$RUNNER_TEMP/additive-ledger.sql" --output json --agent no > "$RUNNER_TEMP/additive-ledger.json"
          node scripts/prospect-enrichment/additive-release-gate.mjs ledger "$RUNNER_TEMP/additive-ledger.json" > "$RUNNER_TEMP/additive-ledger-check.json"
          node scripts/prospect-enrichment/additive-release-gate.mjs candidate-complete "$RUNNER_TEMP/additive-ledger-check.json" > "$RUNNER_TEMP/additive-complete-check.json"
          node scripts/prospect-enrichment/additive-release-gate.mjs catalog-query > "$RUNNER_TEMP/operator-catalog.sql"
          supabase db query --db-url "$MIGRATION_DATABASE_URL" --file "$RUNNER_TEMP/operator-catalog.sql" --output json --agent no > "$RUNNER_TEMP/operator-catalog.json"
          node scripts/prospect-enrichment/additive-release-gate.mjs catalog-bound "$RUNNER_TEMP/operator-catalog.json" "$RUNNER_TEMP/additive-ledger.json" > "$RUNNER_TEMP/operator-catalog-check.json"
          node scripts/prospect-enrichment/migration-gate.mjs stage "$GITHUB_WORKSPACE" "$RUNNER_TEMP/reader-migrations-immediate" > "$RUNNER_TEMP/staged-inventory.json"
          node scripts/prospect-enrichment/migration-gate.mjs full-query > "$RUNNER_TEMP/full-ledger.sql"
          supabase db query --db-url "$MIGRATION_DATABASE_URL" --file "$RUNNER_TEMP/full-ledger.sql" --output json --agent no > "$RUNNER_TEMP/full-ledger.json"
          node scripts/prospect-enrichment/migration-gate.mjs full-ledger "$RUNNER_TEMP/full-ledger.json" "$RUNNER_TEMP/reader-migrations-immediate" candidate-reader-repair-pending '["supabase/migrations/20260930050000_prospect_candidate_coverage_warning_index.sql","supabase/migrations/20260930130000_prospect_candidate_reader_defer_legacy_audit.sql"]' > "$RUNNER_TEMP/full-ledger-check.json"
          (cd "$RUNNER_TEMP/reader-migrations-immediate" && supabase db push --db-url "$MIGRATION_DATABASE_URL" --dry-run --include-all --skip-vault --output-format json) > "$RUNNER_TEMP/preflight-plan.json"
          PLAN_PHASE=pre node scripts/prospect-enrichment/candidate-reader-repair-gate.mjs plan "$RUNNER_TEMP/preflight-plan.json" "$RUNNER_TEMP/full-ledger-check.json" > "$RUNNER_TEMP/preflight-plan-check.json"
          node scripts/prospect-enrichment/migration-gate.mjs verify-stage "$GITHUB_WORKSPACE" "$RUNNER_TEMP/reader-migrations-immediate" "$RUNNER_TEMP/staged-inventory.json" > "$RUNNER_TEMP/stage-check.json"
          echo "apply_started=true" >> "$GITHUB_OUTPUT"
          (cd "$RUNNER_TEMP/reader-migrations-immediate" && supabase db push --db-url "$MIGRATION_DATABASE_URL" --yes --include-all --skip-vault --output-format json) > "$RUNNER_TEMP/apply.json"
      - name: Verify exact migration ledger statements, catalog contract and empty plan
        if: always() && steps.apply_migration.outputs.apply_started == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prospect-enrichment/migration-gate.mjs full-query > "$RUNNER_TEMP/post-full-ledger.sql"
          supabase db query --db-url "$MIGRATION_DATABASE_URL" --file "$RUNNER_TEMP/post-full-ledger.sql" --output json --agent no > "$RUNNER_TEMP/post-full-ledger.json"
          node scripts/prospect-enrichment/migration-gate.mjs full-ledger "$RUNNER_TEMP/post-full-ledger.json" "$RUNNER_TEMP/reader-migrations-immediate" complete > "$RUNNER_TEMP/post-full-ledger-check.json"
          printf "SELECT version,name,statements FROM supabase_migrations.schema_migrations WHERE version IN ('20260930050000','20260930130000') ORDER BY version;\n" > "$RUNNER_TEMP/target-ledger.sql"
          supabase db query --db-url "$MIGRATION_DATABASE_URL" --file "$RUNNER_TEMP/target-ledger.sql" --output json --agent no > "$RUNNER_TEMP/target-ledger.json"
          node scripts/prospect-enrichment/candidate-reader-repair-gate.mjs target-ledger "$RUNNER_TEMP/target-ledger.json" > "$RUNNER_TEMP/target-ledger-check.json"
          node scripts/prospect-enrichment/candidate-reader-repair-gate.mjs catalog-query > "$RUNNER_TEMP/reader-catalog.sql"
          supabase db query --db-url "$MIGRATION_DATABASE_URL" --file "$RUNNER_TEMP/reader-catalog.sql" --output json --agent no > "$RUNNER_TEMP/reader-catalog.json"
          node scripts/prospect-enrichment/candidate-reader-repair-gate.mjs catalog "$RUNNER_TEMP/reader-catalog.json" > "$RUNNER_TEMP/reader-catalog-check.json"
          node scripts/prospect-enrichment/migration-gate.mjs stage "$GITHUB_WORKSPACE" "$RUNNER_TEMP/reader-migrations-post" > "$RUNNER_TEMP/post-staged-inventory.json"
          (cd "$RUNNER_TEMP/reader-migrations-post" && supabase db push --db-url "$MIGRATION_DATABASE_URL" --dry-run --include-all --skip-vault --output-format json) > "$RUNNER_TEMP/post-plan.json"
          PLAN_PHASE=post node scripts/prospect-enrichment/candidate-reader-repair-gate.mjs plan "$RUNNER_TEMP/post-plan.json" "$RUNNER_TEMP/post-full-ledger-check.json" > "$RUNNER_TEMP/post-plan-check.json"
      - name: Upload redacted reader repair apply and read-back evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prospect-reader-repair-apply-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/reviewed-preflight/preflight-binding.json
            ${{ runner.temp }}/reader-source-check.json
            ${{ runner.temp }}/additive-ledger-check.json
            ${{ runner.temp }}/additive-complete-check.json
            ${{ runner.temp }}/operator-catalog-check.json
            ${{ runner.temp }}/connection-check.json
            ${{ runner.temp }}/staged-inventory.json
            ${{ runner.temp }}/full-ledger-check.json
            ${{ runner.temp }}/preflight-plan-check.json
            ${{ runner.temp }}/post-full-ledger-check.json
            ${{ runner.temp }}/target-ledger-check.json
            ${{ runner.temp }}/reader-catalog-check.json
            ${{ runner.temp }}/post-plan-check.json
          if-no-files-found: ignore
          retention-days: 30
