name: Independent Voice-to-Screen segments

on:
  pull_request:
    paths:
      - "src/app/test/voice-screen/**"
      - "src/app/widget/voice-continuation/**"
      - "src/components/voice-screen/**"
      - "src/components/intake-v2/**"
      - "src/lib/voice-screen*"
      - "src/lib/screen-demo*"
      - "src/lib/screen-engine/**"
      - "src/app/globals.css"
      - "src/app/layout.tsx"
      - "src/middleware.ts"
      - "middleware.ts"
      - "next.config.*"
      - "package*.json"
      - "playwright.voice-screen-independent.config.ts"
      - "tests/voice-screen-independent/**"
      - ".github/workflows/voice-screen-independent.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-segments:
    name: Independent widget and brief
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test each segment without service credentials
        run: npx playwright test --config=playwright.voice-screen-independent.config.ts
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Retain rendered evidence and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-screen-independent-evidence
          path: test-results/
          retention-days: 14
