name: Reviewed channel intake history migration

'on':
  workflow_dispatch:
    inputs:
      operation:
        description: Validate the reviewed plan, or apply it after environment approval.
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      confirmation:
        description: "Required only for apply: APPLY-CHANNEL-INTAKE-HISTORY-MIGRATION"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: gta-prospect-migrations-production
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    name: ${{ inputs.operation == 'apply' && 'Apply reviewed migration' || 'Validate reviewed migration' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production prospect migrations
    env:
      PROJECT_REF: ssxryjxifwiivghglqer
      OPERATION: ${{ inputs.operation }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Check out current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.117.0

      - name: Validate source, credentials, and exact migration plan
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.CASELOAD_PRODUCTION_SUPABASE_MIGRATOR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          unset SUPABASE_DB_PASSWORD

          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "The environment-scoped Supabase access token is not available."
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "This workflow must run from main."
            exit 1
          fi

          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          cat > "$RUNNER_TEMP/expected-migrations.sha256" <<'EOF'
          b4b26d906c110e4da72318daebb0624ac98179d060b5dd5346410605c51f574b  supabase/migrations/20260915114633_channel_intake_exchange_history.sql
          EOF
          sha256sum --check --strict "$RUNNER_TEMP/expected-migrations.sha256"

          supabase db push \
            --dry-run \
            --include-all \
            --skip-vault \
            --project-ref "$PROJECT_REF" \
            --output-format json > "$RUNNER_TEMP/plan.json"

          expected='["20260915114633_channel_intake_exchange_history.sql"]'
          jq -e --argjson expected "$expected" '
            .dryRun == true and
            .upToDate == false and
            .migrations == $expected and
            .seeds == [] and
            .roles == []
          ' "$RUNNER_TEMP/plan.json"

      - name: Stop after the default dry run
        if: inputs.operation == 'dry-run'
        shell: bash
        run: |
          set -euo pipefail
          echo "Dry run matched the approved channel intake history migration plan. No schema or data migration was applied."

      - name: Apply the approved migration plan
        if: inputs.operation == 'apply'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.CASELOAD_PRODUCTION_SUPABASE_MIGRATOR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          unset SUPABASE_DB_PASSWORD
          test "$CONFIRMATION" = "APPLY-CHANNEL-INTAKE-HISTORY-MIGRATION"

          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          sha256sum --check --strict "$RUNNER_TEMP/expected-migrations.sha256"

          supabase db push \
            --yes \
            --include-all \
            --skip-vault \
            --project-ref "$PROJECT_REF" \
            --output-format json > "$RUNNER_TEMP/apply.json"

          expected='["20260915114633_channel_intake_exchange_history.sql"]'
          jq -e --argjson expected "$expected" '
            .dryRun == false and
            .migrations == $expected and
            .seeds == [] and
            .roles == []
          ' "$RUNNER_TEMP/apply.json"

          supabase db push \
            --dry-run \
            --include-all \
            --skip-vault \
            --project-ref "$PROJECT_REF" \
            --output-format json > "$RUNNER_TEMP/post-apply-plan.json"

          jq -e '
            .dryRun == true and
            .upToDate == true and
            .migrations == [] and
            .seeds == [] and
            .roles == []
          ' "$RUNNER_TEMP/post-apply-plan.json"

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: channel-intake-history-migration-evidence
          path: |
            ${{ runner.temp }}/plan.json
            ${{ runner.temp }}/apply.json
            ${{ runner.temp }}/post-apply-plan.json
          if-no-files-found: ignore
