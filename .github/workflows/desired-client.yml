name: Desired Client browser checks

on:
  pull_request:
    paths:
      - 'src/components/desired-client/**'
      - 'src/lib/desired-client/**'
      - 'src/app/tools/desired-client-matter/**'
      - 'src/app/api/tools/desired-client-matter/**'
      - 'src/lib/rate-limit.ts'
      - 'next.config.ts'
      - 'tests/desired-client-v2/**'
      - 'playwright.desired-client.config.ts'
      - '.github/workflows/desired-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Desired Client direct browser journey
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.desired-client.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desired-client-direct-browser-results
          path: |
            test-results/desired-client-v2/
            docs/desired-client-v2/review/direct-browser-results.json
          retention-days: 7
